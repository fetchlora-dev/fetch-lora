<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter PIN · Fetch LoRA</title><link rel="icon" href="/static/icon.svg"><link rel="apple-touch-icon" href="/static/icon.png"><link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fetch LoRA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f1420">
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1420;color:#eef1f8;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 .card{box-sizing:border-box;background:#1a2133;border-radius:20px;padding:28px 24px;width:min(340px,90vw);text-align:center}
 h1{font-size:24px;margin:0 0 6px} p{color:#9aa4bd;margin:0 0 20px;font-size:15px}
 input{width:100%;box-sizing:border-box;font-size:32px;letter-spacing:12px;text-align:center;padding:12px;border-radius:14px;border:1px solid #33405e;background:#0f1626;color:#eef1f8}
 button{width:100%;margin-top:16px;padding:14px;font-size:19px;font-weight:700;border:0;border-radius:14px;background:#ff8a3d;color:#1b0f05}
 .err{color:#ff5d6c;min-height:22px;margin-top:12px;font-size:15px}
</style></head><body>
<form class="card" id="f">
 <img src="/static/icon.png" alt="" style="width:72px;height:72px;border-radius:50%"><h1>Fetch LoRA</h1><p>Enter the PIN for this computer.<br>This device will remember it.</p>
 <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" autofocus>
 <button>Unlock</button><div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault(); const fd = new FormData(); fd.append('pin', document.getElementById('pin').value);
  const r = await fetch('/api/login', {method:'POST', body:fd});
  if (r.ok) location.href = '/'; else { document.getElementById('err').textContent = (await r.json()).detail || 'Wrong PIN'; document.getElementById('pin').value=''; }
};
</script></body></html>
