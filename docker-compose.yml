# Copy .env.example to .env and adjust before the first `docker compose up -d --build`.
services:
  dragon-trainer:
    build: .
    image: dragon-trainer:latest
    container_name: dragon-trainer
    restart: unless-stopped
    ports:
      - "${DRAGON_PORT:-8677}:8675"
    environment:
      # Which GPU trains. Use the UUID from `nvidia-smi -L` (or an index like 0).
      # Docker Desktop on Windows ignores per-device GPU requests, so we pin here.
      - CUDA_VISIBLE_DEVICES=${DRAGON_GPU:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - DRAGON_DELIVER_TO=/deliver
      # PIN asked once per device (remembered by a cookie). Change it in .env, then `docker compose up -d`.
      # Left empty, the trainer makes a random one and prints it in `docker logs dragon-trainer`.
      - TRAINER_PIN=${TRAINER_PIN:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ${DRAGON_DATA_DIR:-./data}/jobs:/data/jobs          # photos, configs, samples, checkpoints
      - ${DRAGON_DATA_DIR:-./data}/loras:/exports           # every finished LoRA lands here
      - ${DRAGON_DELIVER_DIR:-./data/deliver}:/deliver      # optional extra copy (e.g. Draw Things drop folder)
      - dragon-hf-cache:/hf-cache                           # base model download (~16 GB, once)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  dragon-hf-cache:
